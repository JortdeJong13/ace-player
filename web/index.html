<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0e">
    <title>Ace Player</title>
    <link rel="icon" type="image/png" sizes="1254x1254" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <section class="home-screen" id="home-screen" aria-labelledby="page-title">
        <div class="home-content">
          <h1 id="page-title">Find a stream</h1>
          <p class="subtitle">Search the Ace Stream network or paste an ID.</p>

          <form class="search-card" id="search-form" role="search">
            <label class="sr-only" for="search-input">Search streams</label>
            <input id="search-input" name="query" type="search" inputmode="search" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Search channels" required>
          </form>
          <p class="form-message" id="form-message" role="alert" hidden></p>

          <section class="search-results" id="search-results" aria-live="polite" hidden>
            <div class="results-heading">
              <h2>Results</h2>
              <span id="result-count"></span>
            </div>
            <div class="results-list" id="results-list"></div>
            <p class="empty-message" id="empty-message" hidden>No streams found.</p>
          </section>

          <button class="latest-card" id="latest-button" type="button" hidden>
            <span class="latest-label">Latest stream</span>
            <span class="latest-name" id="latest-name"></span>
            <span class="latest-action">Resume <span aria-hidden="true">&#8594;</span></span>
          </button>

        </div>
      </section>

      <section class="player-screen" id="player-screen" hidden aria-label="Video player">
        <video id="video" controls playsinline preload="metadata" x-webkit-airplay="allow"></video>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
