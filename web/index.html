<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta id="theme-color" name="theme-color" content="#f5f7fa">
    <title>Ace Player</title>
    <link rel="icon" type="image/png" sizes="1254x1254" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css?v=neutral-2">
  </head>
  <body>
    <main>
      <section class="home-screen" id="home-screen" aria-labelledby="page-title">
        <div class="home-content">
          <div class="intro">
            <h1 id="page-title">Find a stream</h1>
            <p class="subtitle">Search for Ace streams or paste an ID.</p>
          </div>

          <form class="search-form" id="search-form" role="search">
            <label class="cir-search">
              <svg class="cir-search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.34-4.34"></path>
              </svg>
              <input class="cir-search__field" id="search-input" name="query" type="search" inputmode="search" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Search streams" aria-label="Search streams" required>
              <kbd class="cir-search__kbd" aria-hidden="true">⌘ K</kbd>
            </label>
          </form>
          <p class="form-message" id="form-message" role="alert" hidden></p>

          <section class="search-results" id="search-results" aria-live="polite" hidden>
            <div class="results-heading">
              <h2>Results</h2>
              <span id="result-count"></span>
            </div>
            <div class="results-list" id="results-list"></div>
            <p class="empty-message" id="empty-message" hidden>No streams found.</p>
          </section>

          <section class="recent-streams" id="recent-streams" aria-labelledby="recent-title" hidden>
            <div class="results-heading">
              <h2 id="recent-title">Recent streams</h2>
              <span id="recent-count"></span>
            </div>
            <div class="results-list" id="recent-list"></div>
          </section>

        </div>
      </section>

      <section class="player-screen" id="player-screen" hidden aria-label="Video player">
        <video id="video" controls playsinline webkit-playsinline preload="metadata" x-webkit-airplay="allow"></video>
        <div class="playback-status" id="playback-status" role="status" aria-live="polite" hidden>
          <span class="playback-spinner" aria-hidden="true"></span>
          <span class="playback-status-copy">
            <strong id="playback-status-title"></strong>
            <span id="playback-status-detail" hidden></span>
          </span>
          <button id="retry-button" type="button" hidden>Try again</button>
        </div>
      </section>
    </main>
    <script src="/app.js?v=neutral-2" defer></script>
  </body>
</html>
